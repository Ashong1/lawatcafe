<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Can't reach Lawa't Kape</title>
<style>
  :root { --brown: #3E2723; --cream: #FDF8F5; --muted: #795548; --line: #F0E6D2; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--cream); color: var(--brown); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; }
  .card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px 24px; text-align: center; }
  .icon { width: 64px; height: 64px; border-radius: 16px; background: #3B1A0E; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { font-size: 15px; line-height: 1.5; color: var(--muted); margin: 0 0 12px; }
  ul { text-align: left; font-size: 14px; line-height: 1.6; color: var(--muted); padding-left: 20px; margin: 0 0 20px; }
  button { width: 100%; min-height: 48px; border-radius: 999px; font-size: 15px; font-weight: 700; border: 0; cursor: pointer; }
  .primary { background: var(--brown); color: #fff; margin-bottom: 10px; }
  .secondary { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .addr { font-family: ui-monospace, monospace; font-size: 13px; color: var(--muted); margin-top: 14px; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg width="36" height="36" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 24h24v14a10 10 0 0 1-10 10h-4a10 10 0 0 1-10-10V24z" stroke="#FDE68A" stroke-width="4"/>
      <path d="M42 28h4a4 4 0 0 1 4 4v2a4 4 0 0 1-4 4h-4" stroke="#FDE68A" stroke-width="4"/>
    </svg>
  </div>
  <h1>Can't reach the shop system</h1>
  <p>The app only works inside the shop.</p>
  <ul>
    <li>Connect this phone to the shop Wi-Fi.</li>
    <li>If it was a power cut, give the shop router a few minutes to start.</li>
  </ul>
  <button class="primary" onclick="LawatKapeApp.retry()">Try again</button>
  <button class="secondary" onclick="LawatKapeApp.changeServer()">Change server address</button>
  <div class="addr" id="addr"></div>
</div>
<script>
  try { document.getElementById('addr').textContent = LawatKapeApp.serverUrl(); } catch (e) {}
</script>
</body>
</html>
